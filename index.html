<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blox Fruits Gacha - Zioles</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --bg-grad: #e8eef9;
      --panel: #ffffff;
      --panel2: #dbe4f3;
      --accent: #e94560;
      --accent2: #c73650;
      --text: #1f2430;
      --dim: #6b7280;

      --rar-common:      #4d4d63;
      --rar-common-lt:   #8585a0;
      --rar-common-bg:   #c8c8d8;
      --rar-uncommon:    #0d5fb0;      /* Blau */
      --rar-uncommon-lt: #3d9ce0;
      --rar-uncommon-bg: #b8d8f5;
      --rar-rare:        #6b21a8;
      --rar-rare-lt:     #a855f7;
      --rar-rare-bg:     #d8b4fe;
      --rar-legendary:   #b8145e;
      --rar-legendary-lt:#e84a8c;
      --rar-legendary-bg:#f7b6d4;
      --rar-mythical:    #8f1a14;
      --rar-mythical-lt: #c4302a;
      --rar-mythical-bg: #f2c0bd;

      --bfw-btn-bg: #fdf159 50%, #fad536 50%;
      --bfw-btn-bg-pressed: #fad536 50%, #fdf159 50%;
      --bfw-btn-bxsh: #fad536;
      --bfw-btn-bd: #6d4300;
      --bfw-tsh:
        1.5px 0px black, -1.5px 0px black, 0px 1.5px black, 0px -1.5px black,
        1.5px 1.5px black, -1.5px 1.5px black, -1.5px -1.5px black, 1.5px -1.5px black,
        1.5px 1px black, -1.5px 1px black, 1.5px -1px black, -1.5px -1px black,
        -1px -1.5px black, 1px -1.5px black, -1px 1.5px black, 1px 1.5px black,
        -1.5px 3px black, -1px 3px black, 0px 3px black, 1px 3px black, 1.5px 3px black;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, var(--bg-grad) 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; overflow-y: auto;
    }
    .gacha {
      background: var(--panel);
      border: 4px solid var(--panel2);
      border-radius: 18px;
      padding: 22px;
      width: 100%; max-width: 960px;
      box-shadow: 0 18px 40px rgba(31,36,48,.12), 0 2px 6px rgba(31,36,48,.06);
    }
    .title {
      font-size: 2.4em; font-weight: 800; text-align: center; margin-bottom: 14px;
      color: var(--accent);
      text-shadow: 0 1px 0 #fff, 0 2px 6px rgba(233,69,96,.25);
      letter-spacing: .5px;
    }
    .spinner {
      position: relative; width: 100%; height: 190px; overflow: hidden;
      background: linear-gradient(180deg, #eef3fb, #dde7f7);
      border-radius: 12px;
      border: 3px solid #fad536;
      box-shadow: 0 0 0 4px rgba(250,213,54,.18) inset, 0 6px 18px rgba(31,36,48,.08);
    }
    .spinner::before, .spinner::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 70px; z-index: 15; pointer-events: none;
    }
    .spinner::before { left: 0;  background: linear-gradient(90deg,  rgba(255,255,255,.95), rgba(255,255,255,0)); }
    .spinner::after  { right: 0; background: linear-gradient(270deg, rgba(255,255,255,.95), rgba(255,255,255,0)); }

    .track {
      display: flex; position: absolute; left: 0; top: 0; height: 100%;
      will-change: transform;
    }
    .box {
      width: 140px; height: 100%; flex: 0 0 140px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-right: 2px solid rgba(200,210,230,.7);
      transition: transform .2s ease-out, background .3s ease, box-shadow .3s ease;
      position: relative;
      background: #fbfcff;
      transform: scale(1);
    }

    .box.rarity-common    { background: var(--rar-common-bg); }
    .box.rarity-uncommon  { background: var(--rar-uncommon-bg); }
    .box.rarity-rare      { background: var(--rar-rare-bg); }
    .box.rarity-legendary { background: var(--rar-legendary-bg); }
    .box.rarity-mythical  { background: var(--rar-mythical-bg); }

    .box.rarity-common    { border-bottom: 6px solid var(--rar-common); }
    .box.rarity-uncommon  { border-bottom: 6px solid var(--rar-uncommon); }
    .box.rarity-rare      { border-bottom: 6px solid var(--rar-rare); }
    .box.rarity-legendary { border-bottom: 6px solid var(--rar-legendary); }
    .box.rarity-mythical  { border-bottom: 6px solid var(--rar-mythical); }

    .box img {
      width: 82px; height: 82px; object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(31,36,48,.28));
      transition: transform .2s ease-out;
    }
    .box .name {
      font-size: .68em; margin-top: 6px; color: #1f2430; text-align: center;
      max-width: 92%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-weight: 800;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    .box.under-arrow {
      transform: scale(1.08);
      z-index: 10;
      box-shadow: 0 0 20px rgba(0,0,0,.2);
    }
    .box.under-arrow img { transform: scale(1.06); }

    .box.hit {
      border-radius: 10px;
      transform: scale(1.28);
      z-index: 12;
      color: #fff;
      animation: hitPulse 0.6s ease-out;
    }
    .box.hit.rarity-common {
      background: linear-gradient(180deg, var(--rar-common-lt), var(--rar-common));
      box-shadow: 0 0 32px rgba(77,77,99,1), 0 8px 18px rgba(31,36,48,.3);
    }
    .box.hit.rarity-uncommon {
      background: linear-gradient(180deg, var(--rar-uncommon-lt), var(--rar-uncommon));
      box-shadow: 0 0 32px rgba(13,95,176,1), 0 8px 18px rgba(31,36,48,.3);
    }
    .box.hit.rarity-rare {
      background: linear-gradient(180deg, var(--rar-rare-lt), var(--rar-rare));
      box-shadow: 0 0 34px rgba(107,33,168,1), 0 8px 18px rgba(31,36,48,.32);
    }
    .box.hit.rarity-legendary {
      background: linear-gradient(180deg, var(--rar-legendary-lt), var(--rar-legendary));
      box-shadow: 0 0 36px rgba(184,20,94,1), 0 8px 18px rgba(31,36,48,.32);
    }
    .box.hit.rarity-mythical {
      background: linear-gradient(180deg, var(--rar-mythical-lt), var(--rar-mythical));
      box-shadow: 0 0 40px rgba(143,26,20,1), 0 8px 18px rgba(31,36,48,.35);
    }
    .box.hit img {
      transform: scale(1.15);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
    }
    .box.hit .name { color: #fff; font-weight: 800; text-shadow: 0 1px 3px rgba(0,0,0,.5); }

    @keyframes hitPulse {
      0%   { transform: scale(1.1); }
      50%  { transform: scale(1.35); }
      100% { transform: scale(1.28); }
    }

    .arrow.top {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      width: 0; height: 0;
      z-index: 20;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 26px solid #e53935;
      filter: drop-shadow(0 2px 4px rgba(229,57,53,.6));
    }

    .roll, .inventory-clear {
      display: inline-block;
      text-align: center;
      padding: 7px 32px;
      height: 52px;
      min-width: 260px;
      cursor: pointer;
      background: linear-gradient(to bottom, var(--bfw-btn-bg));
      color: white;
      border: 2px solid var(--bfw-btn-bd);
      border-radius: 0px;
      font-weight: normal;
      font-size: 20px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-shadow: var(--bfw-tsh);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: inset 0px 0px 0px 2px var(--bfw-btn-bxsh);
      transition: filter 0.15s ease, transform 0.1s ease, background 0.1s ease;
    }
    .roll:hover:not(:disabled),
    .inventory-clear:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .roll:active:not(:disabled),
    .inventory-clear:active:not(:disabled) {
      background: linear-gradient(to bottom, var(--bfw-btn-bg-pressed));
      transform: translateY(1px);
      filter: brightness(0.95);
    }
    .roll:disabled,
    .inventory-clear:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }

    .status { margin-top: 14px; text-align: center; font-size: 1.05em; color: var(--dim); min-height: 1.4em; }

    .result {
      margin-top: 8px; text-align: center; font-size: 1.7em; font-weight: 800;
      min-height: 1.6em;
      transition: color .3s ease;
    }
    .result.rarity-common    { color: #3d3d52; text-shadow: 0 1px 0 #fff, 0 2px 6px rgba(77,77,99,.55); }
    .result.rarity-uncommon  { color: #0d5fb0; text-shadow: 0 1px 0 #fff, 0 2px 6px rgba(13,95,176,.6); }
    .result.rarity-rare      { color: #581c87; text-shadow: 0 1px 0 #fff, 0 2px 8px rgba(107,33,168,.65); }
    .result.rarity-legendary { color: #95114c; text-shadow: 0 1px 0 #fff, 0 2px 10px rgba(184,20,94,.65); }
    .result.rarity-mythical  { color: #7a140f; text-shadow: 0 1px 0 #fff, 0 2px 12px rgba(143,26,20,.7); }

    .roll-wrap {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .inventory {
      margin-top: 24px;
      border-top: 3px solid var(--panel2);
      padding-top: 16px;
    }
    .inventory-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .inventory-title {
      font-size: 1.3em;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .inventory-count {
      background: var(--accent);
      color: #fff;
      font-size: 0.7em;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 12px;
      min-width: 28px;
      text-align: center;
    }
    .inventory-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
      padding: 4px;
    }
    .inventory-list::-webkit-scrollbar { width: 8px; }
    .inventory-list::-webkit-scrollbar-track { background: var(--panel2); border-radius: 4px; }
    .inventory-list::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 4px; }
    .inventory-empty {
      text-align: center;
      color: var(--dim);
      font-style: italic;
      padding: 24px;
      width: 100%;
    }
    .inv-item {
      position: relative;
      width: 96px;
      border-radius: 8px;
      padding: 8px 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: invPop 0.35s ease-out;
    }
    .inv-item:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 6px 14px rgba(31,36,48,.2);
    }
    .inv-item.rarity-common    { background: var(--rar-common-bg); border-bottom: 4px solid var(--rar-common); }
    .inv-item.rarity-uncommon  { background: var(--rar-uncommon-bg); border-bottom: 4px solid var(--rar-uncommon); }
    .inv-item.rarity-rare      { background: var(--rar-rare-bg); border-bottom: 4px solid var(--rar-rare); }
    .inv-item.rarity-legendary { background: var(--rar-legendary-bg); border-bottom: 4px solid var(--rar-legendary); }
    .inv-item.rarity-mythical  { background: var(--rar-mythical-bg); border-bottom: 4px solid var(--rar-mythical); }

    .inv-item img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 1px 3px rgba(31,36,48,.3));
    }
    .inv-item .inv-name {
      font-size: 0.7em;
      font-weight: 800;
      color: #1f2430;
      text-align: center;
      margin-top: 4px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }
    .inv-item .inv-count {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.7em;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
      box-shadow: 0 2px 4px rgba(0,0,0,.25);
      border: 2px solid #fff;
    }

    @keyframes invPop {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="gacha">
    <div class="title">🍎 Blox Fruits Gacha - Zioles</div>
    <div class="spinner" id="spinner">
      <div class="arrow top" id="arrowTop"></div>
      <div class="track" id="track"></div>
    </div>
    <div class="roll-wrap">
      <button class="roll" id="rollBtn">FREE ROLL</button>
    </div>
    <div class="status" id="status">Bereit zum Ziehen.</div>
    <div class="result" id="result"></div>

    <div class="inventory">
      <div class="inventory-header">
        <div class="inventory-title">
          📦 Inventar
          <span class="inventory-count" id="invCount">0</span>
        </div>
        <button class="inventory-clear" id="clearInvBtn">LEEREN</button>
      </div>
      <div class="inventory-list" id="inventoryList">
        <div class="inventory-empty">Noch keine Früchte gerollt.</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const ICON_BASE = 'https://raw.githubusercontent.com/lzwdev/BloxFruitsStock/main/Blox%20Fruits%20Icons/';
      const ICON_FILES = {
        'Barrier':'Barrier_Fruit.webp','Blade':'Blade_Fruit.webp','Blizzard':'Blizzard_Fruit.webp',
        'Bomb':'Bomb_Fruit.webp','Buddha':'Buddha_Fruit.webp','Chop':'Chop_Fruit.webp',
        'Control':'Control_Fruit.webp','Creation':'Creation_Fruit.webp','Dark':'Dark_Fruit.webp',
        'Diamond':'Diamond_Fruit.webp','Door':'Door_Fruit.webp','Dough':'Dough_Fruit.webp',
        'Dragon':'Dragon_Fruit.webp','Eagle':'Eagle_Fruit.webp','Empyrean':'Empyrean_Fruit.webp',
        'Falcon':'Falcon_Fruit.webp','Fiend':'Fiend_Fruit.webp','Flame':'Flame_Fruit.webp',
        'Gas':'Gas_Fruit.webp','Ghost':'Ghost_Fruit.webp','Gravity':'Gravity_Fruit.webp',
        'Ice':'Ice_Fruit.webp','Kilo':'Kilo_Fruit.webp','Kitsune':'Kitsune_Fruit.webp',
        'Leopard':'Leopard_Fruit.webp','Light':'Light_Fruit.webp','Lightning':'Lightning_Fruit.webp',
        'Love':'Love_Fruit.webp','Magma':'Magma_Fruit.webp','Magnet':'Magnet_Fruit.webp',
        'Mammoth':'Mammoth_Fruit.webp','Meme':'Meme_Fruit.webp',
        'Meme (Admin)':'Meme_%2528Admin%2529_Fruit.webp','Pain':'Pain_Fruit.webp',
        'Paw':'Paw_Fruit.webp','Phoenix':'Phoenix_Fruit.webp','Portal':'Portal_Fruit.webp',
        'Quake':'Quake_Fruit.webp','Revive':'Revive_Fruit.webp','Rocket':'Rocket_Fruit.webp',
        'Rubber':'Rubber_Fruit.webp','Rumble':'Lightning_Fruit.webp','Sand':'Sand_Fruit.webp',
        'Shadow':'Shadow_Fruit.webp','Smoke':'Smoke_Fruit.webp','Soul':'Soul_Fruit.webp',
        'Sound':'Sound_Fruit.webp','Spider':'Spider_Fruit.webp','Spike':'Spike_Fruit.webp',
        'Spin':'Spin_Fruit.webp','Spirit':'Spirit_Fruit.webp','Spring':'Spring_Fruit.webp',
        'String':'String_Fruit.webp','T-Rex':'T-Rex_Fruit.webp','Tiger':'Tiger_Fruit.webp',
        'Venom':'Venom_Fruit.webp','Werewolf':'Werewolf_Fruit.webp','Yeti':'Yeti_Fruit.webp',
      };
      const ICON_DRAGON_CLASSIC = 'Dragon_%2528Classic%2529_Fruit.webp';

      function iconUrl(name, classic) {
        if (name === 'Dragon' && classic) return ICON_BASE + ICON_DRAGON_CLASSIC;
        const f = ICON_FILES[name];
        return f ? ICON_BASE + f : null;
      }
      function iconTag(name, classic) {
        const url = iconUrl(name, classic);
        if (!url) return '';
        return `<img src="${url}" alt="${name}" loading="lazy" decoding="async"
                 referrerpolicy="no-referrer"
                 onerror="this.style.visibility='hidden'">`;
      }

      const RARITY_POOL = [
        { name:'Rocket', weight:15.0, rarity:'common' },
        { name:'Spin',   weight:13.0, rarity:'common' },
        { name:'Blade',  weight:10.0, rarity:'common' },
        { name:'Spring', weight:6.0,  rarity:'common' },
        { name:'Bomb',   weight:4.0,  rarity:'common' },
        { name:'Smoke',  weight:2.5,  rarity:'common' },
        { name:'Spike',  weight:2.0,  rarity:'common' },
        { name:'Flame',   weight:8.5, rarity:'uncommon' },
        { name:'Ice',     weight:7.5, rarity:'uncommon' },
        { name:'Sand',    weight:6.0, rarity:'uncommon' },
        { name:'Dark',    weight:4.5, rarity:'uncommon' },
        { name:'Eagle',   weight:3.0, rarity:'uncommon' },
        { name:'Diamond', weight:2.0, rarity:'uncommon' },
        { name:'Light',   weight:5.5, rarity:'rare' },
        { name:'Rubber',  weight:3.2, rarity:'rare' },
        { name:'Ghost',   weight:2.5, rarity:'rare' },
        { name:'Magma',   weight:2.1, rarity:'rare' },
        { name:'Barrier', weight:1.8, rarity:'rare' },
        { name:'Quake',     weight:1.2, rarity:'legendary' },
        { name:'Buddha',    weight:1.0, rarity:'legendary' },
        { name:'Love',      weight:0.8, rarity:'legendary' },
        { name:'Creation',  weight:0.7, rarity:'legendary' },
        { name:'Spider',    weight:0.6, rarity:'legendary' },
        { name:'Sound',     weight:0.5, rarity:'legendary' },
        { name:'Phoenix',   weight:0.4, rarity:'legendary' },
        { name:'Portal',    weight:0.4, rarity:'legendary' },
        { name:'Lightning', weight:0.3, rarity:'legendary' },
        { name:'Pain',      weight:0.2, rarity:'legendary' },
        { name:'Blizzard',  weight:0.2, rarity:'legendary' },
        { name:'Gravity',  weight:0.35, rarity:'mythical' },
        { name:'Mammoth',  weight:0.28, rarity:'mythical' },
        { name:'T-Rex',    weight:0.25, rarity:'mythical' },
        { name:'Dough',    weight:0.22, rarity:'mythical' },
        { name:'Shadow',   weight:0.19, rarity:'mythical' },
        { name:'Venom',    weight:0.16, rarity:'mythical' },
        { name:'Gas',      weight:0.14, rarity:'mythical' },
        { name:'Spirit',   weight:0.11, rarity:'mythical' },
        { name:'Tiger',    weight:0.09, rarity:'mythical' },
        { name:'Yeti',     weight:0.08, rarity:'mythical' },
        { name:'Magnet',   weight:0.07, rarity:'mythical' },
        { name:'Kitsune',  weight:0.05, rarity:'mythical' },
        { name:'Control',  weight:0.03, rarity:'mythical' },
        { name:'Dragon',   weight:0.01, rarity:'mythical', classic:false },
        { name:'Dragon',   weight:0.01, rarity:'mythical', classic:true  },
      ];

      const totalWeight = RARITY_POOL.reduce((s,f)=>s+f.weight, 0);

      function buildWeightedFruitPool() {
        const pool = [];
        RARITY_POOL.forEach(f => {
          let copies = 1;
          switch (f.rarity) {
            case 'common':    copies = 10; break;
            case 'uncommon':  copies = 6;  break;
            case 'rare':      copies = 4;  break;
            case 'legendary': copies = 2;  break;
            case 'mythical':  copies = 1;  break;
          }
          for (let i=0; i<copies; i++) {
            pool.push({
              name: f.name,
              classic: f.classic || false,
              rarity: f.rarity,
              weight: f.weight,
            });
          }
        });
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        return pool;
      }

      function drawWeightedFruit() {
        const r = Math.random() * totalWeight;
        let cum = 0;
        for (const f of RARITY_POOL) {
          cum += f.weight;
          if (r <= cum) {
            return { name:f.name, classic:f.classic||false, rarity:f.rarity, weight:f.weight };
          }
        }
        const last = RARITY_POOL[RARITY_POOL.length - 1];
        return { name:last.name, classic:last.classic||false, rarity:last.rarity, weight:last.weight };
      }

      const BOX_WIDTH    = 140;
      const TOTAL_BOXES  = 180;
      const TARGET_INDEX = TOTAL_BOXES - 30;
      const DURATION     = 11000;

      const spinner     = document.getElementById('spinner');
      const track       = document.getElementById('track');
      const rollBtn     = document.getElementById('rollBtn');
      const statusEl    = document.getElementById('status');
      const resultEl    = document.getElementById('result');
      const arrowTop    = document.getElementById('arrowTop');

      const invListEl   = document.getElementById('inventoryList');
      const invCountEl  = document.getElementById('invCount');
      const clearInvBtn = document.getElementById('clearInvBtn');

      let rolling = false;
      let weightedPool = [];
      let arrowAnimId = null;

      /* ============================================================
         INVENTAR mit localStorage
         ============================================================ */
      const STORAGE_KEY = 'zioles_gacha_inventory_v1';
      const inventory = new Map();

      function invKey(fruit) {
        return fruit.name + (fruit.classic ? '_classic' : '');
      }

      function saveInventory() {
        try {
          const data = Array.from(inventory.values());
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.warn('localStorage konnte nicht gespeichert werden:', e);
        }
      }

      function loadInventory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (!Array.isArray(data)) return;
          data.forEach(it => {
            if (!it || typeof it !== 'object') return;
            if (typeof it.name !== 'string' || typeof it.count !== 'number') return;
            const key = it.name + (it.classic ? '_classic' : '');
            inventory.set(key, {
              name: it.name,
              classic: !!it.classic,
              rarity: it.rarity || 'common',
              count: it.count,
            });
          });
        } catch (e) {
          console.warn('localStorage konnte nicht geladen werden:', e);
        }
      }

      function addToInventory(fruit) {
        const key = invKey(fruit);
        if (inventory.has(key)) {
          inventory.get(key).count++;
        } else {
          inventory.set(key, {
            name: fruit.name,
            classic: fruit.classic,
            rarity: fruit.rarity,
            count: 1,
          });
        }
        saveInventory();
        renderInventory();
      }

      function renderInventory() {
        const total = Array.from(inventory.values()).reduce((s,it)=>s+it.count, 0);
        invCountEl.textContent = total;

        if (inventory.size === 0) {
          invListEl.innerHTML = '<div class="inventory-empty">Noch keine Früchte gerollt.</div>';
          return;
        }

        const rarityOrder = { mythical: 0, legendary: 1, rare: 2, uncommon: 3, common: 4 };
        const items = Array.from(inventory.values()).sort((a,b) => {
          const ro = rarityOrder[a.rarity] - rarityOrder[b.rarity];
          if (ro !== 0) return ro;
          return a.name.localeCompare(b.name);
        });

        invListEl.innerHTML = '';
        const frag = document.createDocumentFragment();
        items.forEach(it => {
          const div = document.createElement('div');
          div.className = `inv-item rarity-${it.rarity}`;
          div.title = `${it.name}${it.classic ? ' (Classic)' : ''} · ${it.count}x`;
          div.innerHTML = `
            ${iconTag(it.name, it.classic)}
            <div class="inv-name">${it.name}${it.classic ? ' (C)' : ''}</div>
            ${it.count > 1 ? `<div class="inv-count">${it.count}</div>` : ''}
          `;
          frag.appendChild(div);
        });
        invListEl.appendChild(frag);
      }

      clearInvBtn.addEventListener('click', () => {
        if (inventory.size === 0) return;
        if (confirm('Inventar wirklich leeren?')) {
          inventory.clear();
          saveInventory();
          renderInventory();
        }
      });

      /* ============================================================
         SPINNER LOGIK
         ============================================================ */
      function updateUnderArrowBox() {
        if (!track) return;
        const arrowRect = arrowTop.getBoundingClientRect();
        const arrowCenterX = arrowRect.left + arrowRect.width / 2;

        let closestBox = null;
        let closestDist = Infinity;
        const boxes = track.children;
        for (let i = 0; i < boxes.length; i++) {
          const box = boxes[i];
          const r = box.getBoundingClientRect();
          const boxCenter = r.left + r.width / 2;
          const dist = Math.abs(boxCenter - arrowCenterX);
          if (dist < closestDist) {
            closestDist = dist;
            closestBox = box;
          }
        }
        if (closestBox) {
          const prev = track.querySelector('.box.under-arrow');
          if (prev && prev !== closestBox) prev.classList.remove('under-arrow');
          if (!closestBox.classList.contains('hit')) {
            closestBox.classList.add('under-arrow');
          }
        }
        arrowAnimId = requestAnimationFrame(updateUnderArrowBox);
      }

      function startArrowTracking() {
        if (arrowAnimId) cancelAnimationFrame(arrowAnimId);
        arrowAnimId = requestAnimationFrame(updateUnderArrowBox);
      }
      function stopArrowTracking() {
        if (arrowAnimId) {
          cancelAnimationFrame(arrowAnimId);
          arrowAnimId = null;
        }
        track.querySelectorAll('.box.under-arrow').forEach(b => b.classList.remove('under-arrow'));
      }

      function buildBox(fruit) {
        const box = document.createElement('div');
        box.className = `box rarity-${fruit.rarity}`;
        box.dataset.fruit = fruit.name;
        box.dataset.rarity = fruit.rarity;
        box.dataset.classic = fruit.classic ? '1' : '0';
        box.innerHTML = `${iconTag(fruit.name, fruit.classic)}<div class="name">${fruit.name}${fruit.classic ? ' (Classic)' : ''}</div>`;
        return box;
      }

      function buildTrack() {
        weightedPool = buildWeightedFruitPool();
        while (weightedPool.length < TOTAL_BOXES) {
          weightedPool = weightedPool.concat(buildWeightedFruitPool());
        }
        if (weightedPool.length > TOTAL_BOXES) {
          weightedPool = weightedPool.slice(weightedPool.length - TOTAL_BOXES);
        }

        track.innerHTML = '';
        const frag = document.createDocumentFragment();
        for (let i=0; i<TOTAL_BOXES; i++) {
          frag.appendChild(buildBox(weightedPool[i]));
        }
        track.appendChild(frag);

        if (!rolling) {
          track.style.transition = 'none';
          track.style.transform = 'translateX(0px)';
        }
      }

      function startRoll() {
        if (rolling) return;
        rolling = true;
        rollBtn.disabled = true;
        resultEl.textContent = '';
        resultEl.className = 'result';
        statusEl.textContent = 'Ziehe…';

        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        track.querySelectorAll('.box.hit').forEach(b => b.classList.remove('hit'));
        track.querySelectorAll('.box.under-arrow').forEach(b => b.classList.remove('under-arrow'));

        const drawnFruit = drawWeightedFruit();

        const boxes = track.children;
        const targetBox = boxes[TARGET_INDEX];

        targetBox.className = `box rarity-${drawnFruit.rarity}`;
        targetBox.dataset.fruit = drawnFruit.name;
        targetBox.dataset.rarity = drawnFruit.rarity;
        targetBox.dataset.classic = drawnFruit.classic ? '1' : '0';
        targetBox.innerHTML = `${iconTag(drawnFruit.name, drawnFruit.classic)}<div class="name">${drawnFruit.name}${drawnFruit.classic ? ' (Classic)' : ''}</div>`;

        startArrowTracking();

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const containerW = track.parentElement.clientWidth;
            const centerOffset = (containerW / 2) - (BOX_WIDTH / 2);

            // Offset begrenzt auf ±0.45 Boxbreiten, damit der Pfeil
            // garantiert innerhalb der Zielbox landet (kein Bug mehr)
            const randomFactor = (Math.random() * 2 - 1) * 0.45;

            const baseTargetPos = (TARGET_INDEX * BOX_WIDTH) - centerOffset;
            const finalPos = baseTargetPos + (randomFactor * BOX_WIDTH);

            track.style.transition = `transform ${DURATION}ms cubic-bezier(0.22, 0.95, 0.35, 1)`;
            track.style.transform = `translateX(-${finalPos}px)`;

            setTimeout(() => {
              rolling = false;
              rollBtn.disabled = false;
              statusEl.textContent = 'Fertig!';
              resultEl.textContent = `🎉 ${drawnFruit.name}${drawnFruit.classic ? ' (Classic)' : ''} 🎉`;
              resultEl.className = `result rarity-${drawnFruit.rarity}`;

              stopArrowTracking();

              targetBox.classList.add('hit');
              setTimeout(() => targetBox.classList.remove('hit'), 2200);

              addToInventory(drawnFruit);

            }, DURATION + 80);
          });
        });
      }

      /* ============================================================
         INIT
         ============================================================ */
      loadInventory();
      buildTrack();
      renderInventory();
      rollBtn.addEventListener('click', startRoll);

      window.addEventListener('resize', () => {
        if (!rolling) {
          buildTrack();
        }
      });
    })();
  </script>
</body>
</html>
